<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAYUN | Admin Panel - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; height: 100vh; display: flex; }
        
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #00b0ff 0%, #0096e6 100%);
            color: white;
        }
        
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 600; }
        .sidebar-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
        
        .sessions-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .session-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .session-item:hover { background: #f8f9fa; }
        .session-item.active { background: #e3f2fd; border-left: 3px solid #00b0ff; }
        
        .session-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        
        .session-preview {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .session-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }
        
        .session-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            margin-top: 4px;
        }
        
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-pending { background: #fff3e0; color: #ef6c00; }
        .status-closed { background: #f5f5f5; color: #999; }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header-info h3 { font-size: 1rem; font-weight: 600; }
        .chat-header-info p { font-size: 0.85rem; color: #666; }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }
        
        .message.client { align-items: flex-start; }
        .message.manager { align-items: flex-end; }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .message.client .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .message.manager .message-bubble {
            background: #00b0ff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-time {
            font-size: 0.7rem;
            color: #999;
            margin-top: 4px;
        }
        
        .chat-input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .chat-input-form {
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 0.9rem;
            outline: none;
        }
        
        .chat-input:focus { border-color: #00b0ff; }
        
        .chat-send-btn {
            padding: 12px 24px;
            background: #00b0ff;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .chat-send-btn:hover { background: #0096e6; }
        
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 1rem;
        }
        
        .no-chat-selected {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        
        .no-chat-selected svg {
            width: 80px;
            height: 80px;
            fill: #e0e0e0;
            margin-bottom: 16px;
        }
        
        .refresh-btn {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        .refresh-btn:hover { background: #eee; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>BAYUN Chat Admin</h2>
            <p>Active conversations: <span id="activeCount">0</span></p>
        </div>
        <div class="sessions-list" id="sessionsList">
            <!-- Sessions will be loaded here -->
        </div>
    </div>
    
    <div class="chat-area" id="chatArea">
        <div class="no-chat-selected" id="noChatSelected">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
            <p>Select a conversation to start chatting</p>
        </div>
        
        <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3 id="chatClientName">Client Name</h3>
                    <p id="chatSessionId">Session ID</p>
                </div>
                <button class="refresh-btn" onclick="AdminChat.loadMessages()">Refresh</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be loaded here -->
            </div>
            <div class="chat-input-area">
                <div class="chat-input-form">
                    <input type="text" class="chat-input" id="managerInput" placeholder="Type your reply..." />
                    <button class="chat-send-btn" onclick="AdminChat.sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="admin-chat.js"></script>
</body>
</html>
